server.port=8081

spring.application.name=TravelSync

# CORS Configuration
travelsync.cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:4173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:4173

# External Real Web APIs (Zero-key default open endpoints with high rate limits)
travelsync.api.geocoding.openmeteo-url=https://geocoding-api.open-meteo.com/v1/search
travelsync.api.geocoding.nominatim-url=https://nominatim.openstreetmap.org/search
travelsync.api.wikipedia.summary-url=https://en.wikipedia.org/api/rest_v1/page/summary
travelsync.api.wikipedia.api-url=https://en.wikipedia.org/w/api.php
travelsync.api.overpass.url=https://overpass-api.de/api/interpreter
travelsync.api.osrm.table-url=https://router.project-osrm.org/table/v1/driving
travelsync.api.osrm.route-url=https://router.project-osrm.org/route/v1/driving
travelsync.api.weather.url=https://api.open-meteo.com/v1/forecast

# Optional Key-based integrations (Isolated behind configuration)
travelsync.api.geoapify.key=${GEOAPIFY_API_KEY:}
travelsync.api.opentripmap.key=${OPENTRIPMAP_API_KEY:}

# Timeouts & Limits
travelsync.http.connect-timeout-ms=8000
travelsync.http.read-timeout-ms=12000

# Logging
logging.level.com.travelsync=INFO
logging.level.org.springframework.web=INFO
